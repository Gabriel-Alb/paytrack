# Optional TLS terminator: use together with compose.yaml.
services:
  frontend:
    environment:
      TLS_PROXY_CIDR: 172.31.0.3/32
  tls:
    image: caddy:2-alpine
    user: "1000:1000"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Defina o hostname sem protocolo}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    ports:
      - "${TLS_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
      - "${TLS_BIND_IP:-0.0.0.0}:${HTTPS_REDIRECT_PORT:-80}:8081"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.31.0.3
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
