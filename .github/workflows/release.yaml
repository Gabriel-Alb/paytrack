name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yaml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/paytrack-${{ matrix.component }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
  deploy:
    # Opt-in only after provisioning a protected production runner and TLS.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: [self-hosted, linux, paytrack-production]
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrate, deploy and verify HTTPS
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          DEPLOY_STATE_DIR: ${{ vars.DEPLOY_STATE_DIR }}
          DEPLOY_TLS: ${{ vars.DEPLOY_TLS }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          export BACKEND_IMAGE="ghcr.io/${OWNER,,}/paytrack-backend"
          export FRONTEND_IMAGE="ghcr.io/${OWNER,,}/paytrack-frontend"
          bash scripts/deploy.sh
